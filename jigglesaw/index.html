<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e2e0da" />
    <title>Foam</title>
    <script type="module" crossorigin src="./assets/index-Bh0EmXYU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dq-43FoU.css">
  </head>
  <body>
    <canvas id="scene" aria-label="Foam jigsaw pieces scattered around a dotted area on a table. Drag pieces into their neighbours."></canvas>

    <button id="music" class="icon-btn music" type="button" aria-pressed="true" aria-label="Music on. Turn off (M)">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" /><path class="wave" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.8 6.8a7.4 7.4 0 0 1 0 10.4" /></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" /><path class="wave" d="M15.5 9.5l5 5M20.5 9.5l-5 5" /></svg>
    </button>

    <button id="theme" class="icon-btn theme" type="button" aria-label="Switch to dark mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18" /></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.2A7.8 7.8 0 0 1 9.8 4.5a7.8 7.8 0 1 0 9.7 9.7z" /></svg>
    </button>

    <nav id="presets" class="presets" aria-label="Pictures"></nav>

    <div class="actions">
      <button id="peek-open" class="icon-btn peek-btn" type="button" aria-label="View puzzle image" title="View puzzle image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 12S6.2 5.8 12 5.8 21.2 12 21.2 12 17.8 18.2 12 18.2 2.8 12 2.8 12z" /><circle cx="12" cy="12" r="3.1" /></svg>
      </button>
      <label class="upload" for="file" id="upload" tabindex="0" role="button">
        <span class="slot" aria-hidden="true">
          <svg class="pic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3" /><circle cx="9" cy="10" r="1.6" /><path d="M4.5 17l5-4.5 3.5 3 2.5-2 4 3.5" /></svg>
          <svg class="lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.4" /><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" /></svg>
        </span>
        <span class="label">Use your own image</span>
      </label>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg" hidden />

    <div id="unlock" class="unlock" role="dialog" aria-labelledby="unlock-title" hidden>
      <div id="unlock-sparks" class="sparks" aria-hidden="true"></div>
      <button id="unlock-close" class="unlock-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
      </button>
      <p id="unlock-title" class="unlock-title">oops, that's a paid feature, but for the dodo team <span id="unlock-reveal" class="reveal" tabindex="0">the code is <b>DODO</b></span></p>
      <form id="unlock-form" class="unlock-form" autocomplete="off">
        <label class="sr-only" for="unlock-code">4-letter code</label>
        <input id="unlock-code" type="text" inputmode="text" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="····" />
        <button type="submit">unlock</button>
      </form>
      <p id="unlock-note" class="unlock-note" aria-live="polite"></p>
      <p id="unlock-win" class="unlock-win" aria-live="polite" hidden>yay, feature unlocked</p>
    </div>

    <div id="peek" class="peek" role="dialog" aria-modal="true" aria-label="The finished puzzle" hidden>
      <canvas id="peek-canvas"></canvas>
      <p class="peek-note">this is what you're building · tap anywhere to go back</p>
    </div>

    <p id="hint" class="hint">24 pieces · build it inside the dots</p>
    <button id="scatter" class="scatter" type="button">scatter <kbd>R</kbd></button>

  </body>
</html>
