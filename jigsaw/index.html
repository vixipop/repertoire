<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e2e0da" />
    <title>Foam</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="Foam jigsaw pieces scattered around a dotted area on a table. Drag pieces into their neighbours."></canvas>
    <p id="hint" class="hint">24 pieces · build it inside the dots</p>
    <button id="music" class="music" type="button" aria-pressed="true">music on</button>
    <label class="upload" for="file">use your own image</label>
    <input id="file" type="file" accept="image/*" hidden />
    <button id="again" class="again" type="button">scatter <kbd>R</kbd></button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
