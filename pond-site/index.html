<style>/* ==========================================================================
   Swan pond
   Wider than the text column and centred on it; the edges feather out into
   the page, so swans leaving the frame dissolve rather than clip.
   ========================================================================== */

.pond {
  position: relative;
  align-self: center;
  width: min(680px, calc(100vw - 32px));
  aspect-ratio: 16 / 10;
  border-radius: 28px;
  overflow: hidden;
  background: #2c4e3f; /* shown only if WebGL is unavailable */
  cursor: pointer;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-mask-image:
    linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 8%, #000 92%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 8%, #000 92%, transparent 100%);
  mask-composite: intersect;
}
.pond canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
@media (max-width: 720px) {
  .pond { aspect-ratio: 4 / 3; border-radius: 20px; }
}

/* swans talking: tiny handwritten remarks over their heads */
.pond { -webkit-touch-callout: none; }
.pond-talk { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 2; }
.pond-say {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
  /* the tuner can try other lettering through these */
  font-family: var(--say-font, var(--font-hand, "Gaegu")), cursive;
  font-size: var(--say-size, 20px);
  font-style: var(--say-style, normal);
  line-height: 1.5;
  white-space: nowrap;
}
.pond-say > span {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  transform: translate(-50%, -100%) rotate(var(--tilt, 0deg));
  animation: pond-say linear forwards;
}
.pond-say b { font-weight: var(--say-weight, 700); }
.pond-say i { display: inline-block; font-style: inherit; }
.pond-say svg {
  display: block;
  width: 0.6em;
  height: 0.6em;
  margin: 1px 0 0 -12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.3;
  stroke-linecap: round;
}
/* cross: every letter trembles */
.pond-say.is-cross i { animation: pond-shake 0.09s steps(2) infinite alternate; }
@keyframes pond-say {
  0% { opacity: 0; }
  12% { opacity: 1; }
  78% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes pond-shake {
  0% { transform: translate(-0.5px, 0.3px) rotate(-4deg); }
  100% { transform: translate(0.5px, -0.4px) rotate(4deg); }
}
@media (prefers-reduced-motion: reduce) {
  .pond-say i { animation: none !important; }
}



:root {
  --page: #f5f3ee; --ink: #2a2d2b; --muted: #8b8f8c; color-scheme: light;
  --pw: min(1180px, calc(100vw - 220px), calc((100svh - 150px) * 1.6));
}
html[data-time="dawn"] { --page: #f6ece9; --ink: #4b3a42; --muted: #9a8890; }
html[data-time="dusk"] { --page: #2a2237; --ink: #f0dcea; --muted: #a595b4; color-scheme: dark; }
html[data-time="dark"] { --page: #0b0d15; --ink: #d3dcf2; --muted: #7482a3; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); transition: background-color 1.6s ease, color 1.6s ease; }
body {
  min-height: 100svh;
  display: grid;
  grid-template-rows: auto 1fr;
  font: 14px/22px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
.boot, .boot * { transition: none !important; }

.bar { width: var(--pw); margin: 0 auto; padding: 20px 0 0; height: 64px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; letter-spacing: 0.02em; }
.moon { position: relative; width: 26px; height: 26px; flex: none; }
.moon img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 1.4s ease; }
.moon-glow { opacity: 0; }
html[data-time="dusk"] .moon-glow, html[data-time="dark"] .moon-glow { opacity: 1; }
html[data-time="dusk"] .moon-ink, html[data-time="dark"] .moon-ink { opacity: 0; }

.tools { display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.tool { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; transition: color 0.2s ease, background-color 0.2s ease; }
.tool:hover, .tool:focus-visible { color: var(--ink); }
.tool:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
.tool svg { width: 18px; height: 18px; display: block; }
.tool .solid { fill: currentColor; }
.tool .line { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#mute .off, #mute[data-audible="false"] .on { display: none; }
#mute[data-audible="false"] .off { display: block; }

main { display: grid; place-items: center; padding-bottom: 24px; }
.pond { width: var(--pw); cursor: pointer; }

.corn { display: none; }
.times { position: fixed; right: 28px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.times button { font: inherit; font-size: 13px; letter-spacing: 0.04em; padding: 4px 0 4px 14px; border: 0; background: none; color: var(--muted); cursor: pointer; position: relative; transition: color 0.2s ease; }
.times button:hover, .times button:focus-visible { color: var(--ink); }
.times button[aria-pressed="true"] { color: var(--ink); }
.times button[aria-pressed="true"]::before { content: ""; position: absolute; left: 2px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: currentColor; }

.toast { position: fixed; top: 76px; left: 50%; transform: translate(-50%, -6px); padding: 6px 14px; border-radius: 999px; background: var(--ink); color: var(--page); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 5; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  :root { --pw: calc(100vw - 32px); }
  .pond { aspect-ratio: 4 / 3; }
  main { align-content: center; grid-template-rows: auto auto auto; gap: 18px; justify-items: center; }
  .corn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13px; letter-spacing: 0.04em; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--muted); background: none; color: var(--ink); cursor: pointer; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
  .corn svg { width: 14px; height: 14px; fill: #f2c94c; stroke: #b88a1e; stroke-width: 1.2; }
  .corn[aria-pressed="true"] { background: #f7e08a; border-color: #f7e08a; color: #2a2d2b; }
  .times { position: static; transform: none; flex-direction: row; justify-content: center; gap: 4px; width: var(--pw); }
  .times button { padding: 6px 12px; }
  .times button[aria-pressed="true"]::before { display: none; }
  .times button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 5px; }
}

<script>
/**
 * Painted swans — smooth, luminous, a little otherworldly.
 *
 * Each swan is a "look": its own proportions and pearl palette. Forms are
 * built from soft gradients rather than outlines: a lit core, a cool shadow
 * side, an inner rim of light on the sun side, and faint feather rows. The
 * water shader softens and blooms the whole layer afterwards, which is what
 * gives the glow.
 *
 * Units: one swan length = 1, facing +x. The caller sets up the transform.
 */
const PLUMAGE = [
    // champagne pearl
    { hi: [255, 252, 245], mid: [243, 237, 226], shade: [200, 195, 200], deep: [150, 150, 168], rim: [255, 247, 228], mottle: null },
    // moon blue
    { hi: [253, 254, 255], mid: [235, 241, 247], shade: [188, 201, 216], deep: [128, 146, 176], rim: [236, 246, 255], mottle: null },
    // dusky lavender, a few taupe feathers left from youth
    { hi: [249, 245, 241], mid: [229, 223, 221], shade: [186, 178, 188], deep: [132, 124, 144], rim: [255, 241, 232], mottle: [164, 146, 132] },
];
const BEAKS = [
    ["#c9522a", "#ee8048", "#ffc7a0"],
    ["#d65f30", "#f39256", "#ffd3b0"],
    ["#bd4b28", "#e2733f", "#f6b08a"],
];
const mixRGB = (a, b, t) => [
    Math.round(a[0] + (b[0] - a[0]) * t),
    Math.round(a[1] + (b[1] - a[1]) * t),
    Math.round(a[2] + (b[2] - a[2]) * t),
];
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function makeLook(index, rnd = Math.random) {
    const r = (a, b) => a + rnd() * (b - a);
    const nose = r(0.34, 0.39);
    const rear = r(-0.68, -0.62);
    const look = {
        bw: [0.255, 0.228, 0.243][index % 3] + r(-0.022, 0.022),
        nose,
        rear,
        neckLen: r(0.44, 0.54),
        neckW: r(0.09, 0.11),
        headR: r(0.078, 0.09),
        tailLen: r(0.1, 0.16),
        wingLen: 0.15 - rear - 0.01,
        wingScale: r(0.86, 1.14),
        feathers: [],
        p: PLUMAGE[index % PLUMAGE.length],
        beak: BEAKS[index % BEAKS.length],
        rowJitter: Array.from({ length: 24 }, () => r(-1, 1)),
        mottle: [],
        tail: [],
    };
    if (look.p.mottle) {
        for (let i = 0; i < 7; i++)
            look.mottle.push({ x: r(-0.5, 0.05), y: r(-0.15, 0.15), r: r(0.04, 0.09) });
    }
    // wing feathers by tract: 0 primaries, 1 secondaries, 2 greater coverts,
    // 3 lesser coverts — drawn in that order so each layer overlaps the last
    const counts = [8, 8, 8, 11];
    counts.forEach((count, tract) => {
        for (let i = 0; i < count; i++) {
            look.feathers.push({
                tract,
                u: count === 1 ? 0 : i / (count - 1),
                len: r(0.88, 1.12),
                w: r(0.85, 1.15),
                ang: r(-0.07, 0.07),
                tone: r(-1, 1),
            });
        }
    });
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
        const u = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
        look.tail.push({ a: u * r(0.28, 0.4), len: look.tailLen * (1 - Math.abs(u) * 0.3) });
    }
    return look;
}
/* --------------------------------------------------------------------------
   Shapes
   -------------------------------------------------------------------------- */
function bodyPath(l) {
    const { bw, nose, rear } = l;
    const p = new Path2D();
    p.moveTo(nose, 0);
    p.bezierCurveTo(nose, bw * 0.86, 0.14, bw, -0.04, bw);
    p.bezierCurveTo(-0.26, bw * 0.98, -0.5, bw * 0.5, rear, 0);
    p.bezierCurveTo(-0.5, -bw * 0.5, -0.26, -bw * 0.98, -0.04, -bw);
    p.bezierCurveTo(0.14, -bw, nose, -bw * 0.86, nose, 0);
    p.closePath();
    return p;
}
function cubicPts(out, p0, p1, p2, p3, n) {
    for (let i = 0; i < n; i++) {
        const t = i / n;
        const u = 1 - t;
        out.push([
            u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
            u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
        ]);
    }
}
/**
 * Wing outline in normalised wing space (b = 0 shoulder … 1 tip, backward;
 * o = outward). Folded it lies along the back with the tip crossing the
 * spine; opened, the trailing edge breaks into soft feather tips.
 */
function wingOutline(spread) {
    const pts = [];
    const tipO = -0.12 + spread * 0.42;
    const innerO = -0.24 - spread * 0.06;
    cubicPts(pts, [0, 0], [0.16, 1.05], [0.6, 1.0], [1, tipO], 20);
    const F = 7;
    for (let j = 0; j <= F * 2; j++) {
        const b = 1 - j / (F * 2);
        const base = innerO + (tipO - innerO) * Math.pow(b, 1.6);
        const notch = j % 2 === 1 ? spread * 0.2 * (0.4 + b) : 0;
        pts.push([b, base - notch]);
    }
    return pts;
}
/** Smooth closed curve through points (quadratic through midpoints). */
function smoothClosed(ctx, pts) {
    const n = pts.length;
    const m0x = (pts[n - 1][0] + pts[0][0]) / 2;
    const m0y = (pts[n - 1][1] + pts[0][1]) / 2;
    ctx.moveTo(m0x, m0y);
    for (let i = 0; i < n; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % n];
        ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    }
    ctx.closePath();
}
/* --------------------------------------------------------------------------
   Painting
   -------------------------------------------------------------------------- */
function paintSwan(ctx, look, pose) {
    const { p } = look;
    const lx = pose.lx;
    const ly = pose.ly;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const roll = 1 + Math.sin(pose.paddle) * 0.014 * Math.min(pose.speedRatio, 1.5);
    /* feet, seen faintly through the water */
    const footA = Math.min(0.32, 0.08 + pose.speedRatio * 0.26);
    for (const side of [1, -1]) {
        const ph = pose.paddle + (side > 0 ? 0 : Math.PI);
        const fx = -0.28 + Math.sin(ph) * 0.07;
        const fy = side * look.bw * 0.72;
        ctx.fillStyle = `rgba(30,34,40,${footA})`;
        ctx.beginPath();
        ctx.moveTo(fx + 0.1, fy * 0.85);
        ctx.quadraticCurveTo(fx - 0.04, fy + side * 0.1, fx - 0.13, fy + side * 0.09 * (0.5 + 0.5 * Math.cos(ph)));
        ctx.lineTo(fx - 0.12, fy - side * 0.035);
        ctx.closePath();
        ctx.fill();
    }
    /* tail tuft, peeking past the crossed wingtips */
    ctx.save();
    ctx.translate(look.rear + 0.07, 0);
    ctx.rotate(pose.jig);
    for (const f of look.tail) {
        const a = f.a * (1 + pose.tailAmp * 1.6);
        const ex = -Math.cos(a) * (f.len + 0.07);
        const ey = Math.sin(a) * (f.len + 0.07);
        const nx = -Math.sin(a) * 0.028;
        const ny = -Math.cos(a) * 0.028;
        const g = ctx.createLinearGradient(0, 0, ex, ey);
        g.addColorStop(0, css(p.mid));
        g.addColorStop(1, css(p.shade, 0.9));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(nx, ny);
        ctx.quadraticCurveTo(ex * 0.55 + nx * 1.2, ey * 0.55 + ny * 1.2, ex, ey);
        ctx.quadraticCurveTo(ex * 0.55 - nx * 1.2, ey * 0.55 - ny * 1.2, -nx, -ny);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
    /* body */
    const body = bodyPath(look);
    ctx.save();
    ctx.scale(1, roll);
    {
        const cx = -0.08 + lx * 0.14;
        const cy = ly * look.bw * 0.55;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 0.66);
        g.addColorStop(0, css(p.hi));
        g.addColorStop(0.42, css(p.mid));
        g.addColorStop(0.78, css(p.shade));
        g.addColorStop(1, css(p.deep));
        ctx.fillStyle = g;
        ctx.fill(body);
        ctx.save();
        ctx.clip(body);
        // cool shadow pooled on the far side, warm rim of light on the near side
        ctx.lineWidth = 0.06;
        ctx.translate(-lx * 0.03, -ly * 0.03);
        ctx.strokeStyle = css(p.rim, 0.75);
        ctx.stroke(body);
        ctx.translate(lx * 0.06, ly * 0.06);
        ctx.strokeStyle = css(p.deep, 0.35);
        ctx.lineWidth = 0.07;
        ctx.stroke(body);
        ctx.restore();
        for (const m of look.mottle) {
            const g2 = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
            g2.addColorStop(0, css(p.mottle, 0.22));
            g2.addColorStop(1, css(p.mottle, 0));
            ctx.fillStyle = g2;
            ctx.fillRect(m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
        }
    }
    ctx.restore();
    /* wings */
    const spread = pose.spread;
    const outline = wingOutline(spread);
    for (const side of [1, -1]) {
        const theta = spread * 1.45;
        const len = (look.wingLen + spread * 0.78) * (0.94 + look.wingScale * 0.06);
        const cw = (look.bw * 0.86 + spread * 0.08) * (0.9 + look.wingScale * 0.1);
        const sx = 0.15;
        const sy = side * look.bw * 0.24;
        const c = Math.cos(-side * theta);
        const sn = Math.sin(-side * theta);
        const map = (b, o) => {
            const x = -b * len;
            const y = side * o * cw;
            return [sx + x * c - y * sn, sy + x * sn + y * c];
        };
        const mapped = outline.map(([b, o]) => map(b, o));
        const wing = new Path2D();

    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));

  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);

// Dappled shade from overhanging leaves, swaying.
float shade(vec2 p, float t) {
  vec2 q = p / (150.0 * uScale);
  vec2 sway = vec2(sin(t * 0.23) * 0.18 + sin(t * 0.61) * 0.05, cos(t * 0.19) * 0.12);
  float n = fbm(q + sway + vec2(3.1, 0.0));
  n += 0.18 * fbm(q * 3.1 - sway * 2.0);
  float canopy = smoothstep(1.1, 0.1, distance(p / uRes, vec2(0.95, -0.05)));
  return smoothstep(0.52, 0.72, n + canopy * 0.22) * (0.35 + canopy * 0.65);

// 0 at the shallow rim, ~1 in the deep middle.
float depthAt(vec2 p) {
  vec2 uv = p / uRes;
  float ar = uRes.x / uRes.y;
  float edge = min(min(uv.x, 1.0 - uv.x) * ar, min(uv.y, 1.0 - uv.y));
  float bowl = smoothstep(0.0, 0.45, edge);
  float n = fbm(p / (190.0 * uScale) + 4.0);
  return clamp(bowl * (0.5 + 0.7 * n), 0.0, 1.0);
}

// Slow wandering current, used to wobble the floor as seen through it.
vec2 current(vec2 p, float t) {
  vec2 q = p / (160.0 * uScale);
  return vec2(fbm(q + vec2(t * 0.06, 0.0)) - 0.5, fbm(q + vec2(5.2, t * 0.05)) - 0.5);

vec3 bedAt(vec2 p, float blur) {
  vec2 uv = clamp(p / uRes, 0.001, 0.999);
  vec2 px = vec2(blur) / uRes;
  vec3 c = texture2D(uBed, uv).rgb * 0.4;
  c += texture2D(uBed, uv + vec2(px.x, 0.0)).rgb * 0.15;
  c += texture2D(uBed, uv - vec2(px.x, 0.0)).rgb * 0.15;
  c += texture2D(uBed, uv + vec2(0.0, px.y)).rgb * 0.15;
  c += texture2D(uBed, uv - vec2(0.0, px.y)).rgb * 0.15;
  return c;
}

float canopyA(vec2 p) {
  return texture2D(uCanopy, clamp(p / uRes, 0.0, 1.0)).a;
}

// The canopy's silhouette, thrown down-right across the water by the sun.
float canopyShadow(vec2 p, float depth) {

  float r = (5.0 + 6.0 * depth) * uScale;
  float a = canopyA(q) * 0.2;
  for (int i = 0; i < 8; i++) {
    float an = float(i) * 0.785398 + 0.2;
    a += canopyA(q + vec2(cos(an), sin(an)) * r) * 0.1;
  }
  return a;
}

// Shafts of sun slanting down through gaps in the leaves.
float sunbeams(vec2 p, float t) {

  streak *= 0.6 + 0.4 * noise(vec2(across * 2.7 + 3.0, t * 0.07));
  // trace back toward the sun: lit only where that path met leaves with a gap
  float near = canopyA(p - dir * 70.0 * uScale);
  float wide = 0.0;
  for (int i = 0; i < 4; i++) {
    float an = float(i) * 1.5708;
    wide += canopyA(p - dir * 70.0 * uScale + vec2(cos(an), sin(an)) * 30.0 * uScale) * 0.25;
  }
  float gap = smoothstep(0.05, 0.35, wide) * (1.0 - near * 0.8);
  return streak * gap * exp(-along * 1.4);
}

vec4 swanTex(vec2 p) {
  return texture2D(uSwans, clamp(p / uRes, 0.0, 1.0));
}

// The sun is top-left, so a swan's shadow falls down-right onto the floor —
// further away and softer where the water is deeper.
float swanShadow(vec2 p, float depth) {
  vec2 off = vec2(0.55, 0.83) * (8.0 + 36.0 * depth) * uScale;
  float r = (2.0 + 9.0 * depth) * uScale;
  vec2 q = p - off;
  float a = swanTex(q).a * 0.2;
  for (int i = 0; i < 8; i++) {
    float an = float(i) * 0.785398;
    a += swanTex(q + vec2(cos(an), sin(an)) * r).a * 0.1;
  }
  return a;
}

vec4 swanSoft(vec2 p) {
  float r = 0.8 * uScale;
  vec4 s = swanTex(p) * 0.4;
  for (int i = 0; i < 8; i++) {
    float an = float(i) * 0.785398 + 0.3;
    s += swanTex(p + vec2(cos(an), sin(an)) * r) * 0.075;
  }
  return s;
}

float swanHalo(vec2 p) {
  float h = 0.0;
  for (int i = 0; i < 6; i++) {
    float an = float(i) * 1.0472;
    vec4 a = swanTex(p + vec2(cos(an), sin(an)) * 7.0 * uScale);
    vec4 b = swanTex(p + vec2(cos(an + 0.5), sin(an + 0.5)) * 17.0 * uScale);
    h += dot(a.rgb, vec3(0.3333)) * 0.6 + dot(b.rgb, vec3(0.3333)) * 0.4;

    float sc = (22.0 + fl * 15.0) * uScale;
    vec2 q = p / sc + vec2(t * (0.05 + fl * 0.03), t * 0.02);
    vec2 id = floor(q);
    vec2 f = fract(q);
    float h = hash(id + fl * 7.0);

      m += smoothstep(0.09, 0.0, length(f - c)) * (0.5 + 0.5 * h);

  return m;

    star *= 0.5 + 0.5 * sin(uTime * 2.0 + hash(floor(sc) + 3.0) * 40.0);
    col += vec3(0.85, 0.9, 1.0) * star * uMoon * 0.5 * (1.0 - dap * 0.7);

  col *= 1.0 - csh * 0.06;

  // swans and leaves: softened, tinted, glowing onto the water around them
  vec4 sw = swanSoft(p);
  float halo = swanHalo(p);
  vec3 srgb = sw.rgb;
  float grey = dot(srgb, vec3(0.3333));
  float satv = (max(srgb.r, max(srgb.g, srgb.b)) - min(srgb.r, min(srgb.g, srgb.b))) / max(sw.a, 0.001);
  srgb = mix(srgb, grey * uTint * 1.1, uTintAmt * (1.0 - smoothstep(0.12, 0.4, satv)));
  vec3 glowCol = mix(vec3(1.0, 0.98, 0.94), uTint, 0.35 + uTintAmt);
  col += glowCol * halo * uGlow * 0.6 * (1.0 - sw.a);
  col = col * (1.0 - sw.a) + srgb * (1.0 + uGlow * 0.12);

  // overhanging vines, nearest the eye: backlit where the sun comes through
  vec4 cv = texture2D(uCanopy, clamp(p / uRes, 0.0, 1.0));
  // leaves take the hour's light: sun-coloured by day, moon-dark silhouettes at night
  float dayK = clamp((uLight - 0.2) * 1.4, 0.0, 1.0);
  vec3 lightOn = mix(vec3(0.16, 0.2, 0.32), mix(vec3(1.0), uSun * 1.25, uLeafSun), dayK);
  vec3 crgb = cv.rgb * lightOn * (0.5 + 0.45 * dayK);
  crgb += cv.a * vec3(0.05, 0.07, 0.12) * uMoon;
  crgb += cv.a * vec3(0.16, 0.2, 0.04) * beams * uLight;
  col = col * (1.0 - cv.a) + crgb;

  // morning mist: soft banks drifting with the air, thicker toward the far bank,
  // brighter where the sun shafts catch it
  if (uFog > 0.001) {
    vec2 fq = p / (210.0 * uScale);
    float f1 = fbm(fq + vec2(uTime * 0.018, uTime * 0.006));
    float f2 = fbm(fq * 2.1 - vec2(uTime * 0.027, -uTime * 0.01) + 7.3);
    float mist = smoothstep(0.42, 0.78, f1 * 0.7 + f2 * 0.45);
    mist = mix(mist, 1.0, 0.1) * (0.5 + 0.5 * smoothstep(0.0, 1.0, vUv.y));
    float fogA = clamp(mist * uFog * 0.85, 0.0, 0.85);
    vec3 fc = uFogCol + uSun * beams * 0.25;
    col = mix(col, fc, fogA);

  vec2 v = vUv - 0.5;
  col *= 1.0 - dot(v, v) * 0.5;
  gl_FragColor = vec4(col, 1.0);

                sizeLayers();
            }
            else if (hasGL && avg < 0.0125 && sceneK < 0.7) {
                sceneK = Math.min(0.7, sceneK + 0.1);
                sizeLayers();
            }
            perfAcc = 0;
            perfN = 0;
        }
        // looks change like light does: gradually
        params = mixParams(params, target, 1 - Math.exp(-dt * 1.4));
        uploadParams();
        // safety net: if every swan is off-frame, call the next one back now
        // (a swan already swimming off past the edge counts as gone)
        const m = 20 * scale;
        const inView = (s) => s.state !== "away" && s.x > m && s.x < W - m && s.y > m && s.y < H - m;
        const away = swans.filter((s) => s.state === "away");
        if (away.length && !swans.some(inView) && !swans.some((s) => s.state === "return")) {
            const next = away.reduce((a, b) => (a.awayUntil < b.awayUntil ? a : b));
            next.awayUntil = Math.min(next.awayUntil, clock + 0.25);
        }
        for (const s of swans)
            update(s, dt * motion);
        updateTiger(dt);
        resolveOverlaps(dt * motion);
        updateLeaves(dt);
        updatePetals(dt);
        updateKernels(dt);
        for (let i = ripples.length - 1; i >= 0; i--)
            if (clock - ripples[i].t > 5.5)
                ripples.splice(i, 1);
        // surface layer: leaves under swans, swans back-to-front
        const k = paint.width / W;
        pctx.setTransform(k, 0, 0, k, 0, 0);
        pctx.clearRect(0, 0, W, H);
        for (const f of leaves)
            drawLeaf(pctx, f);
        for (const f of petals)
            if (f.landed)
                drawPetal(pctx, f);
        for (const k of kernels)
            if (k.landed)
                drawKernel(pctx, k);
        const live = swans.filter((s) => s.state !== "away").sort((a, b) => a.y - b.y);
        for (const s of live)
            drawSwan(pctx, s);
        if (tiger)
            drawTiger(pctx, tiger);
        for (const f of petals)
            if (!f.landed)
                drawPetal(pctx, f);
        for (const k of kernels)
            if (!k.landed)
                drawKernel(pctx, k);
        if (hasGL && gl && waterProg && postProg) {
            drawWeeds();
            drawWakes();
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, tBed);
            upload(1, tWeeds, weeds, true);
            upload(2, tSwans, paint, true);
            upload(3, tSurf, surf, false);
            // the canopy only sways slowly, so it can be redrawn every other frame
            if ((canopyTick++ & 1) === 0) {
                drawVines();
                upload(5, tCanopy, canopy, true);
            }
            rippleData.fill(0);
            ripples.forEach((r, i) => {
                rippleData[i * 4] = r.x;
                rippleData[i * 4 + 1] = r.y;
                rippleData[i * 4 + 2] = r.t;
                rippleData[i * 4 + 3] = r.a;
            });
            // pass 1: water + swans into the scene texture
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.viewport(0, 0, sceneW, sceneH);
            gl.useProgram(waterProg);
            gl.uniform1i(wu.uBed, 0);
            gl.uniform1i(wu.uWeeds, 1);
            gl.uniform1i(wu.uSwans, 2);
            gl.uniform1i(wu.uSurf, 3);
            gl.uniform1i(wu.uCanopy, 5);
            gl.uniform2f(wu.uRes, W, H);
            gl.uniform1f(wu.uTime, clock);
            gl.uniform1f(wu.uScale, scale);
            gl.uniform4fv(wu.uRipples, rippleData);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            // pass 2: paint it
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.viewport(0, 0, waterCanvas.width, waterCanvas.height);
            gl.useProgram(postProg);
            gl.activeTexture(gl.TEXTURE4);
            gl.bindTexture(gl.TEXTURE_2D, tScene);
            gl.uniform1i(pu.uScene, 4);
            gl.uniform1i(pu.uSwans, 2);
            gl.uniform2f(pu.uRes, W, H);
            gl.uniform1f(pu.uTime, clock);
            gl.uniform1f(pu.uScale, scale);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
        else {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, swanCanvas.width, swanCanvas.height);
            ctx.drawImage(paint, 0, 0, swanCanvas.width, swanCanvas.height);
        }
        updateTalk();
        for (const cb of frameListeners)
            cb();
        scheduleFromFrame();
    };
    const schedule = () => {
        if (!raf && visible && pageVisible) {
            last = performance.now();
            raf = requestAnimationFrame(frame);
        }
    };
    const scheduleFromFrame = () => {
        if (!raf && visible && pageVisible)
            raf = requestAnimationFrame(frame);
    };
    const io = new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting;
        schedule();
    });
    io.observe(host);
    const onVis = () => {
        pageVisible = !document.hidden;
        schedule();
    };
    document.addEventListener("visibilitychange", onVis);
    const ro = new ResizeObserver(() => resize());
    ro.observe(host);
    resize();
    uploadParams();
    schedule();
    return {
        setParams(p, instant = false) {
            target = { ...target, ...p };
            if (instant) {
                params = { ...target };
                uploadParams();
            }
        },
        getParams() {
            return { ...target };
        },
        size() {
            return { width: W, height: H };
        },
        onFrame(cb) {
            frameListeners.add(cb);
            return () => frameListeners.delete(cb);
        },
        setTapMode(mode) {
            tapFeeds = mode === "feed";
        },
        setHighQuality(width) {
            if (!hasGL)
                return;
            if (width && !hqWidth)
                beforeHq = { wd, sceneK };
            if (width) {
                hqWidth = width;
                sceneK = 0.875;
            }
            else if (hqWidth) {
                hqWidth = 0;
                wd = beforeHq.wd;
                sceneK = beforeHq.sceneK;
            }
            else
                return;
            sizeLayers();
        },
        chatter() {
            const here = swans.filter((s) => s.state !== "away" && s.x > 0 && s.x < W && s.y > 0 && s.y < H);
            const all = [...CROSS, ...HUNGRY, ...FULL, ...MORE, "dibs!", "glutton!"];
            for (const s of here.sort(() => Math.random() - 0.5).slice(0, 2)) {
                const text = pick(all);
                say(s, text, CROSS.includes(text) ? "cross" : "calm", 2.2);
            }
        },
        snapshot(c, w, h) {
            // the page behind shows through the torn edge
            c.save();
            c.globalCompositeOperation = "source-over";
            c.clearRect(0, 0, w, h);
            c.imageSmoothingQuality = "high";
            c.drawImage(hasGL ? waterCanvas : swanCanvas, 0, 0, w, h);
            if (edgeMask) {
                c.globalCompositeOperation = "destination-in";
                c.drawImage(edgeMask, 0, 0, w, h);
            }
            c.globalCompositeOperation = "destination-over";
            c.fillStyle = getComputedStyle(document.body).backgroundColor || "#fafafa";
            c.fillRect(0, 0, w, h);
            c.restore();
            // the remarks are DOM text over the canvas, so paint them in by hand,
            // letter by letter where the page has laid them out (shake and all)
            const box = host.getBoundingClientRect();
            const kx = w / (box.width || 1);
            const ky = h / (box.height || 1);
            for (const b of bubbles) {
                const inner = b.el.firstElementChild;
                if (!inner)
                    continue;
                const alpha = Number(getComputedStyle(inner).opacity);
                if (!(alpha > 0.01))
                    continue;
                const cs = getComputedStyle(b.el.querySelector("b") ?? b.el);
                c.save();
                c.globalAlpha = alpha;
                c.fillStyle = cs.color;
                c.strokeStyle = cs.color;
                c.font = `${cs.fontStyle} ${cs.fontWeight} ${parseFloat(cs.fontSize) * kx}px ${cs.fontFamily}`;
                c.textAlign = "center";
                c.textBaseline = "middle";
                for (const l of b.el.querySelectorAll("i")) {
                    const r = l.getBoundingClientRect();
                    c.fillText(l.textContent ?? "", (r.left + r.width / 2 - box.left) * kx, (r.top + r.height / 2 - box.top) * ky);
                }
                const svg = b.el.querySelector("svg");
                if (svg) {
                    const r = svg.getBoundingClientRect();
                    const u = (r.width / 12) * kx;
                    c.lineWidth = 1.3 * u;
                    c.lineCap = "round";
                    c.translate((r.left - box.left) * kx, (r.top - box.top) * ky);
                    c.beginPath();
                    c.moveTo(8.5 * u, 1.5 * u);
                    c.bezierCurveTo(7.9 * u, 4.5 * u, 6.5 * u, 7.1 * u, 3.9 * u, 9.9 * u);
                    c.stroke();
                }
                c.restore();
            }
        },
        destroy() {
            if (raf)
                cancelAnimationFrame(raf);
            host.style.cursor = "";
            io.disconnect();
            ro.disconnect();
            document.removeEventListener("visibilitychange", onVis);
            host.removeEventListener("pointermove", onMove);
            host.removeEventListener("pointerleave", onLeave);
            host.removeEventListener("pointerdown", onDown);
            host.removeEventListener("contextmenu", onCtx);
            host.removeEventListener("pointerup", onUp);
            clearTimeout(holdTimer);
            talk.remove();
            gl?.getExtension("WEBGL_lose_context")?.loseContext();
        },
    };
}

/**
 * Time of day. The pond follows the viewer's local clock, blending between
 * the four looks around sunrise and sunset.
 */

const TIME_NAMES = ["Dawn", "Day", "Dusk", "Dark"];
const defaultLooks = () => Object.fromEntries(TIMES.map((t) => [t.name, { ...t.params }]));
// hour → look; between two different neighbours the looks crossfade
const KEYS = [
    [0, "Dark"],
    [4.5, "Dark"],
    [5.8, "Dawn"],
    [7.4, "Dawn"],
    [8.5, "Day"],
    [16.8, "Day"],
    [18, "Dusk"],
    [19.6, "Dusk"],
    [20.8, "Dark"],
    [24, "Dark"],
];
const TIME_HOURS = {
    Dawn: "5–8am",
    Day: "8am–5pm",
    Dusk: "5–8pm",
    Dark: "8pm–5am",
};
function lookAt(looks, date = new Date()) {
    const h = date.getHours() + date.getMinutes() / 60;
    for (let i = 0; i < KEYS.length - 1; i++) {
        const [h0, a] = KEYS[i];
        const [h1, b] = KEYS[i + 1];
        if (h >= h0 && h <= h1) {
            const u = h1 > h0 ? (h - h0) / (h1 - h0) : 0;
            const t = u * u * (3 - 2 * u);
            return { params: a === b ? { ...looks[a] } : mixParams(looks[a], looks[b], t), name: t < 0.5 ? a : b };
        }
    }
    return { params: { ...looks.Day }, name: "Day" };
}
/** Keep the pond in step with the clock. Returns a function that stops it. */
function followClock(ctl, getLooks, instant = true) {
    ctl.setParams(lookAt(getLooks()).params, instant);
    const id = window.setInterval(() => ctl.setParams(lookAt(getLooks()).params), 30000);
    return () => window.clearInterval(id);
}

/**
 * Background music for the pond. The track plays through Web Audio so one
 * gain node sets the volume for both the speakers and the video recorder.
 * Browsers only allow sound after a click, so nothing starts until play().
 */
function createMusic(src, volume = 0.6) {
    const el = new Audio();
    el.src = src;
    el.loop = true;
    el.preload = "auto";
    let ctx = null;
    let gain = null;
    let out = null;
    let level = volume;
    const listeners = new Set();
    const changed = () => listeners.forEach((cb) => cb());
    el.addEventListener("play", changed);
    el.addEventListener("pause", changed);
    // wired up on the first play, inside the click that asked for it
    const wire = () => {
        if (ctx)
            return;
        const AC = window.AudioContext ?? window.webkitAudioContext;
        ctx = new AC();
        const source = ctx.createMediaElementSource(el);
        gain = ctx.createGain();
        gain.gain.value = level;
        out = ctx.createMediaStreamDestination();
        source.connect(gain);
        gain.connect(ctx.destination);
        gain.connect(out);
    };
    return {
        async play() {
            wire();
            await ctx?.resume();
            await el.play();
        },
        pause() {
            el.pause();
        },
        get playing() {
            return !el.paused;
        },
        setVolume(v) {
            level = v;
            // ease it so dragging the slider doesn't click
            if (gain && ctx)
                gain.gain.setTargetAtTime(v, ctx.currentTime, 0.05);
        },
        tracks() {
            return out ? out.stream.getAudioTracks() : [];
        },
        onChange(cb) {
            listeners.add(cb);
            return () => listeners.delete(cb);
        },
        destroy() {
            el.pause();
            el.removeAttribute("src");
            void ctx?.close();
            listeners.clear();
        },
    };
}


(() => {
  // ---- edit these ----
  const SITE = {
    twitter: "https://x.com/vixenpspsps/status/2107388697327083537?s=20", // link to the post
    linkedin: "https://lnkd.in/p/deyMy8i3", // link to the post
    email: "jahnavijworks@gmail.com",
    music: "music.mp3",
    volume: 0.5,
  };
  // --------------------
  const root = document.documentElement;
  root.classList.add("boot");
  const $ = (id) => document.getElementById(id);
  $("x").href = SITE.twitter;
  $("in").href = SITE.linkedin;

  /* the pond, following the clock unless a time of day is picked */
  const looks = defaultLooks();
  const pond = $("pond");
  const ctl = startPond(pond, $("water"), $("swans"), lookAt(looks).params);
  let stopClock = followClock(ctl, () => looks, true);
  let mode = "auto";

  const times = $("times");
  const buttons = new Map();
  for (const name of TIME_NAMES) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name.toLowerCase();
    b.addEventListener("click", () => {
      stopClock();
      if (mode === name) {
        mode = "auto";
        stopClock = followClock(ctl, () => looks, false);
      } else {
        mode = name;
        stopClock = () => {};
        ctl.setParams(looks[name]);
      }
      sync();
    });
    times.appendChild(b);
    buttons.set(name, b);
  }
  const sync = () => {
    const name = mode === "auto" ? lookAt(looks).name : mode;
    root.dataset.time = name.toLowerCase();
    for (const [n, b] of buttons) {
      b.setAttribute("aria-pressed", String(n === name));
      b.title = n === name && mode !== "auto" ? "click again to follow the clock" : "";
    }
  };
  sync();
  setInterval(sync, 30000);
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("boot")));

  // remarks scale with the pond
  const fit = () => root.style.setProperty("--say-size", (20 * Math.pow(Math.max(0.6, pond.clientWidth / 680), 0.8)).toFixed(1) + "px");
  new ResizeObserver(fit).observe(pond);
  fit();

  /* corn mode, for phones: tap the pond to feed instead of splash */
  const corn = $("corn");
  corn.addEventListener("click", () => {
    const on = corn.getAttribute("aria-pressed") !== "true";
    corn.setAttribute("aria-pressed", String(on));
    ctl.setTapMode(on ? "feed" : "splash");
    toast(on ? "tap the pond to toss corn" : "tap the pond to splash");
  });
  // leaving a phone-sized window with corn on would leave left clicks feeding with no button to undo it
  matchMedia("(min-width: 761px)").addEventListener("change", (e) => {
    if (e.matches && corn.getAttribute("aria-pressed") === "true") corn.click();
  });

  /* copy buttons */
  const toastEl = $("toast");
  let toastTimer = 0;
  const toast = (msg) => {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
  };
  const copy = async (text, msg) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const t = document.createElement("textarea");
      t.value = text;
      t.setAttribute("readonly", "");
      t.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(t);
      t.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      t.remove();
      if (!ok) return toast("couldn't copy");
    }
    toast(msg);
  };
  $("copy-link").addEventListener("click", () => copy(location.href, "link copied"));
  $("copy-mail").addEventListener("click", () => copy(SITE.email, "email copied"));

  /* music: on by default. Browsers only allow sound after a click, tap or key, so it
     starts with the first of those; the mute button sits on the top right */
  const music = createMusic(SITE.music, SITE.volume);
  const mute = $("mute");
  let muted = false;
  const paintMute = () => {
    mute.dataset.audible = String(!muted);
    mute.setAttribute("aria-label", muted ? "Unmute music" : "Mute music");
  };
  paintMute();
  const start = async () => {
    try {
      music.setVolume(muted ? 0 : SITE.volume);
      await music.play();
    } catch {
      /* still blocked: the next click or key tries again */
    }
    paintMute();
  };
  mute.addEventListener("click", () => {
    muted = !muted;
    music.setVolume(muted ? 0 : SITE.volume);
    if (!muted && !music.playing) start();
    paintMute();
  });
  const gestures = ["pointerdown", "pointerup", "keydown", "touchend"];
  const onGesture = (e) => {
    if (e.target instanceof Node && mute.contains(e.target)) return;
    if (muted) return;
    start().then(() => {
      if (music.playing) gestures.forEach((t) => document.removeEventListener(t, onGesture, true));
    });
  };
  gestures.forEach((t) => document.addEventListener(t, onGesture, true));
  start(); // plays straight away where the browser allows it
  // and quiet while the tab is out of sight
  let resume = false;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (music.playing) { resume = true; music.pause(); }
    } else if (resume) {
      resume = false;
      if (!muted) start();
    }
  });
})();
